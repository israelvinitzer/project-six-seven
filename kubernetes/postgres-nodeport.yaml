apiVersion: v1
kind: Service
metadata:
  name: postgres-bastion
  namespace: cnpg-system

spec:
  type: NodePort

  selector:
    cnpg.io/cluster: airis-postgres
    cnpg.io/instanceRole: primary

  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30432